<!DOCTYPE html>
<html lang="en" class="play">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Steer a growing snake, eat the blue pellets, and beat your best score. Touch pad, swipe, or keyboard.">
  <title>Snake</title>
  <meta property="og:title" content="Snake">
  <meta property="og:description" content="Steer a growing snake, eat the blue pellets, and beat your best score. Touch pad, swipe, or keyboard.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://raw.githack.com/alexnaughtonjr/games/main/games/snake/index.html">
  <meta property="og:image" content="https://raw.githubusercontent.com/alexnaughtonjr/games/main/games/snake/media/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Snake">
  <meta name="twitter:description" content="Steer a growing snake, eat the blue pellets, and beat your best score. Touch pad, swipe, or keyboard.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/alexnaughtonjr/games/main/games/snake/media/og.png">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../shared/mobile.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Snake</h1>
      <a class="back" href="../../index.html">All games</a>
    </header>
    <p class="lede">Eat the blue pellets. Avoid the walls and your own tail.</p>
    <section class="panel" aria-label="Snake game">
      <div class="stats">
        <div><span class="label">Score</span><strong id="score">0</strong></div>
        <div class="stat-best"><span class="label">Best:</span><strong id="best">—</strong></div>
        <div><span class="label">Length</span><strong id="length">3</strong></div>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="480" height="480" tabindex="0" aria-label="Snake board"></canvas>
        <div id="overlay" class="overlay" hidden>
          <h2 id="overlay-title">Ready</h2>
          <p id="overlay-record" class="record" hidden>NEW HIGH SCORE!</p>
          <p id="overlay-text"></p>
          <button id="overlay-restart" class="primary" type="button">Play again</button>
        </div>
      </div>
      <div class="actions">
        <button id="pause" type="button">Pause</button>
        <button id="restart" type="button">Restart</button>
      </div>
      <div class="pad" id="pad" aria-label="Direction pad">
        <button type="button" data-dir="up" aria-label="Up">↑</button>
        <button type="button" data-dir="left" aria-label="Left">←</button>
        <button type="button" data-dir="down" aria-label="Down">↓</button>
        <button type="button" data-dir="right" aria-label="Right">→</button>
      </div>
      <p class="help">Tap Start, the pad, or swipe the board. Arrows or WASD steer. Space pauses. Best score stays in this browser.</p>
    </section>
  </main>
  <script src="../shared/highscore.js"></script>
  <script src="../../shared/mobile.js"></script>
  <script src="game.js"></script>
</body>
</html>
